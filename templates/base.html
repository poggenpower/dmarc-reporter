{% load static %}
<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}DMARC Reporter{% endblock %}</title>
  <link rel="stylesheet" href="{% static 'reports/app.css' %}">
</head>
<body>
  <header class="site-header">
    <a class="brand" href="{% url 'dashboard' %}">DMARC Reporter</a>
    {% if user.is_authenticated %}
      <nav aria-label="Account">
        {% if user.is_staff %}<a href="{% url 'admin:index' %}">Administration</a>{% endif %}
        <a href="{% url 'account_settings' %}">Account settings</a>
        <span>{{ user.get_username }}</span>
        <form action="{% url 'logout' %}" method="post">
          {% csrf_token %}
          <button class="link-button" type="submit">Sign out</button>
        </form>
      </nav>
    {% endif %}
  </header>
  <main class="container">
    {% block content %}{% endblock %}
  </main>
  {% block scripts %}{% endblock %}
</body>
</html>
