{% extends "base.html" %}
{% block title %}Sign in · DMARC Reporter{% endblock %}
{% block content %}
<section class="login-panel">
  <h1>Sign in</h1>
  <p>Sign in to browse DMARC aggregate reports.</p>
  {% if form.errors %}<p class="error" role="alert">Username or password is incorrect.</p>{% endif %}
  <form method="post">
    {% csrf_token %}
    <input type="hidden" name="next" value="{{ next }}">
    <div class="field">
      <label for="{{ form.username.id_for_label }}">Username</label>
      {{ form.username }}
    </div>
    <div class="field">
      <label for="{{ form.password.id_for_label }}">Password</label>
      {{ form.password }}
    </div>
    <button class="button" type="submit">Sign in</button>
  </form>
</section>
{% endblock %}
