name: Tag release

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  actions: write
  contents: write

concurrency:
  group: tag-main-release
  cancel-in-progress: false

jobs:
  tag-release:
    runs-on: ubuntu-latest
    permissions:
      actions: write
      contents: write
      pull-requests: read
    steps:
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
      - name: Calculate and create release tag
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          latest_tag="$(git tag --list 'v[0-9]*' --sort=-version:refname | head -n 1)"
          if [[ -n "$latest_tag" ]]; then
            tag_version="${latest_tag#v}"
            git rev-list --reverse "$latest_tag..main" > "$RUNNER_TEMP/main-commits.txt"
          else
            tag_version="$(cat VERSION)"
            git rev-list --reverse main > "$RUNNER_TEMP/main-commits.txt"
          fi

          gh api --paginate --slurp \
            "repos/${GITHUB_REPOSITORY}/pulls?state=closed&base=main&per_page=100" \
            > "$RUNNER_TEMP/closed-pull-requests.json"
          pull_requests="$(python scripts/release_prs_since_tag.py \
            "$RUNNER_TEMP/closed-pull-requests.json" "$RUNNER_TEMP/main-commits.txt")"
          if [[ -z "$pull_requests" ]]; then
            echo "No merged pull requests found since ${latest_tag:-the beginning of main}."
            exit 0
          fi

          commit_files="$RUNNER_TEMP/release-commit-files.txt"
          : > "$commit_files"
          while IFS= read -r pull_request; do
            [[ -z "$pull_request" ]] && continue
            commits_file="$RUNNER_TEMP/pr-$pull_request-commits.json"
            gh api --paginate --slurp \
              "repos/${GITHUB_REPOSITORY}/pulls/${pull_request}/commits" \
              > "$commits_file"
            printf '%s\n' "$commits_file" >> "$commit_files"
          done <<< "$pull_requests"

          printf '%s\n' "$tag_version" > VERSION
          version="$(python scripts/bump_version.py --pull-request-files "$commit_files")"
          if [[ "$version" == "skip" ]]; then
            echo "No releasable commits found since ${latest_tag:-the beginning of main}."
            exit 0
          fi

          tag="v$version"
          if git rev-parse "$tag" >/dev/null 2>&1; then
            echo "Tag $tag already exists; refusing to move or overwrite it." >&2
            exit 1
          fi

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git tag -a "$tag" main -m "Release $tag"
          git push origin "$tag"
          gh workflow run release.yml --ref "$tag"
          echo "Created $tag at $(git rev-parse main)."
