apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmarc-reporter-ingest
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dmarc-reporter
      app.kubernetes.io/component: ingest
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dmarc-reporter
        app.kubernetes.io/component: ingest
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      initContainers:
        - name: migrate
          image: ghcr.io/example-org/dmarc-reporter:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "migrate", "--noinput"]
          envFrom:
            - configMapRef:
                name: dmarc-reporter-config
            - secretRef:
                name: dmarc-reporter-django
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 128Mi
            limits:
              cpu: 500m
              memory: 512Mi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: tmp
              mountPath: /tmp
      containers:
        - name: ingest
          image: ghcr.io/example-org/dmarc-reporter:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "ingest_dmarc"]
          envFrom:
            - configMapRef:
                name: dmarc-reporter-config
            - secretRef:
                name: dmarc-reporter-django
            - secretRef:
                name: dmarc-reporter-imap
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: geoip
              mountPath: /geoip
              readOnly: true
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dmarc-reporter-data
        - name: geoip
          persistentVolumeClaim:
            claimName: dmarc-reporter-geoip
            readOnly: true
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
