apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

resources:
  - persistentvolumeclaims.yaml
  - web.yaml
  - ingest.yaml
  - geoip-updater.yaml
  - email-report-cronjob.yaml

configMapGenerator:
  - name: dmarc-reporter-config
    envs:
      - config/app.env

secretGenerator:
  - name: dmarc-reporter-django
    envs:
      - secret-files/django.env
  - name: dmarc-reporter-imap
    envs:
      - secret-files/imap.env
  - name: dmarc-reporter-smtp
    envs:
      - secret-files/smtp.env
  - name: dmarc-reporter-report-api
    envs:
      - secret-files/report-api.env
