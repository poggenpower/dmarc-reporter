apiVersion: apps/v1
kind: Deployment
metadata:
  name: dmarc-reporter-geoip-updater
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: dmarc-reporter
      app.kubernetes.io/component: geoip-updater
  template:
    metadata:
      labels:
        app.kubernetes.io/name: dmarc-reporter
        app.kubernetes.io/component: geoip-updater
    spec:
      serviceAccountName: default
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 10001
        runAsGroup: 10001
        fsGroup: 10001
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: geoip-updater
          image: ghcr.io/example-org/dmarc-reporter:latest
          imagePullPolicy: IfNotPresent
          command: ["python", "manage.py", "update_geoip", "--watch"]
          envFrom:
            - configMapRef:
                name: dmarc-reporter-config
            - secretRef:
                name: dmarc-reporter-django
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
          resources:
            requests:
              cpu: 100m
              memory: 256Mi
            limits:
              cpu: 1
              memory: 1Gi
          volumeMounts:
            - name: data
              mountPath: /data
            - name: geoip
              mountPath: /geoip
            - name: tmp
              mountPath: /tmp
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: dmarc-reporter-data
        - name: geoip
          persistentVolumeClaim:
            claimName: dmarc-reporter-geoip
        - name: tmp
          emptyDir:
            sizeLimit: 64Mi
